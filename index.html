<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUW Leaderboard</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1a; --muted:#77776f; --line:#e4e4de; --accent:#3b6fd4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e22; --text:#ececea; --muted:#9a9aa2; --line:#2c2c32; --accent:#7ea6f5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:24px 16px; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:12px 14px; text-align:left; white-space:nowrap; }
  th { color:var(--muted); font-size:.75rem; text-transform:uppercase; border-bottom:1px solid var(--line); }
  tr + tr td { border-top:1px solid var(--line); }
  .pos { color:var(--muted); width:40px; }
  .first .pos { color:var(--accent); font-weight:700; }
  .rank { font-weight:600; }
  .muted { color:var(--muted); }
  footer { margin-top:16px; color:var(--muted); font-size:.72rem; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>EUW Leaderboard</h1>
  <div class="sub" id="status">Yükleniyor…</div>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Oyuncu</th><th>Rank</th><th>LP</th><th>W/L</th><th>WR</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <footer>Solo/Duo ranked. Her 2 dakikada bir otomatik yenilenir.<br>
  This site isn't endorsed by Riot Games and doesn't reflect the views or opinions of Riot Games.</footer>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const BIG = ["MASTER","GRANDMASTER","CHALLENGER"];

async function refresh() {
  const status = document.getElementById("status");
  try {
    const r = await fetch("/api/ranks");
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.getElementById("rows").innerHTML = d.players.map((p, i) => {
      const rank = p.tier ? (BIG.includes(p.tier) ? p.tier : p.tier + " " + p.division) : "Unranked";
      return `<tr class="${i === 0 && p.tier ? "first" : ""}">
        <td class="pos">${i + 1}</td>
        <td>${esc(p.id)}</td>
        <td class="rank ${p.tier ? "" : "muted"}">${esc(rank)}</td>
        <td>${p.tier ? p.lp : "–"}</td>
        <td class="muted">${p.tier ? p.wins + "/" + p.losses : "–"}</td>
        <td>${p.tier ? p.winrate + "%" : "–"}</td></tr>`;
    }).join("");
    status.textContent = "Son güncelleme: " + new Date(d.updated).toLocaleTimeString();
  } catch (e) {
    status.textContent = "Veri alınamadı, tekrar denenecek…";
  }
}
refresh();
setInterval(refresh, 120000);
</script>
</body>
</html>
